<!DOCTYPE html>
<html>
<head>
    <title>Sat Snooper Control</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 20px; 
            background-color: #121212; /* Dark background */
            color: #e0e0e0; /* Light text */
        }
        .container { 
            background-color: #1e1e1e; /* Slightly lighter dark for container */
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0 0 15px rgba(0,0,0,0.5); 
        }
        h1, h2 { 
            color: #e0e0e0; 
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
        }
        .info-section, .control-section { 
            margin-bottom: 20px; 
            padding: 15px;
            background-color: #2c2c2c;
            border-radius: 6px;
        }
        .info-item, .control-item { 
            margin-bottom: 12px; 
            display: flex;
            align-items: center;
        }
        label { 
            font-weight: bold; 
            margin-right: 10px; 
            color: #bbb; /* Lighter label color */
            min-width: 180px; /* Align inputs */
        }
        input[type="number"], input[type="text"] { 
            padding: 10px; 
            border-radius: 4px; 
            border: 1px solid #444; /* Darker border */
            background-color: #333; /* Dark input background */
            color: #e0e0e0; /* Light text in input */
            width: 220px; 
        }
        button { 
            padding: 10px 18px; 
            background-color: #007bff; /* Primary button color - can adjust for dark theme */
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 1em;
        }
        button:hover { 
            background-color: #0056b3; 
        }
        #tunerStatus { /* Changed from pre to div */
            background-color: #2c2c2c; /* Darker background for status area */
            padding: 15px; 
            border-radius: 4px; 
            min-height: 100px;
        }
        .status-button {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 4px;
            color: white;
            text-align: center;
            min-width: 100px; 
            font-weight: bold;
        }
        .status-green {
            background-color: #28a745; /* Green */
        }
        .status-red {
            background-color: #dc3545; /* Red */
        }
        .error { color: #ff6b6b; /* Lighter red for errors on dark bg */ }
        .success { color: #69f0ae; /* Lighter green for success on dark bg */ }
        #tuneResult, #actionResult { margin-top: 10px; font-weight: bold; min-height: 1.2em; /* Reserve space */ }

        /* Styles for the toggle switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }
        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #555; /* Darker slider background */
            -webkit-transition: .4s;
            transition: .4s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            -webkit-transition: .4s;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #007bff; /* Blue when checked */
        }
        input:focus + .slider {
            box-shadow: 0 0 1px #007bff;
        }
        input:checked + .slider:before {
            -webkit-transform: translateX(26px);
            -ms-transform: translateX(26px);
            transform: translateX(26px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sat Snooper Control</h1>

        <div class="info-section">
            <h2>Tuner Status</h2>
            <div id="tunerStatus">Loading status...</div>
        </div>

        <div class="control-section">
            <h2>Tuner Actions</h2>
            <div class="control-item">
                <label for="tunerResetSwitch">Tuner Reset:</label>
                <label class="switch">
                    <input type="checkbox" id="tunerResetSwitch" onchange="setTunerReset()">
                    <span class="slider"></span>
                </label>
                <label for="tunerPolarization">Polarization:</label>
                <label class="switch">
                    <input type="checkbox" id="tunerPolarization" onchange="setPolarization()">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="control-item">
                <button onclick="initializeTuner()">Initialize Tuner</button>
            </div>
            <div id="actionResult"></div>
        </div>

        <div class="control-section">
            <h2>Tune Channel</h2>
            <div class="control-item">
                <label for="freq_mhz">Frequency (MHz):</label>
                <input type="text" id="freq_mhz" value="10847">
                <label for="sr">Symbol Rate (kSps):</label>
                <input type="text" id="sr" value="22000">
                <label for="pol">Pol.:</label>
                <select id="pol">
                    <option value="0" selected>V</option>
                    <option value="1">H</option>
                </select>
            </div>
            <div class="control-item">
                <label for="delsys">Delivery System:</label>
                <select id="delsys">
                    <option value="5" selected>DVB-S</option>
                    <option value="6">DVB-S2</option>
                </select>
                <label for="mod">Modulation:</label>
                <select id="mod">
                    <option value="0" selected>QPSK</option>
                    <option value="9">8PSK</option>
                </select>
                <label for="fec">FEC:</label>
                <select id="fec">
                    <option value="0">NONE</option>
                    <option value="1">1/2</option>
                    <option value="2">2/3</option>
                    <option value="3">3/4</option>
                    <option value="3">3/5</option>
                    <option value="4">4/5</option>
                    <option value="5" selected>5/6</option>
                    <option value="6">6/7</option>
                    <option value="7">7/8</option>
                    <option value="8">8/9</option>
                    <option value="9">9/10</option>
                </select>
            </div>
            <div class="control-item">
                <label for="inv">Inversion:</label>
                <select id="inv">
                    <option value="0" selected>OFF</option>
                    <option value="1">ON</option>
                    <option value="2">AUTO</option>
                </select>
                <label for="pilot">Pilot:</label>
                <select id="pilot">
                    <option value="0" selected>OFF</option>
                    <option value="1">ON</option>
                    <option value="2">AUTO</option>
                </select>
                <label for="rolloff">Rolloff:</label>
                <select id="rolloff">
                    <option value="0" selected>0.35</option>
                    <option value="1">0.20</option>
                    <option value="2">0.25</option>
                    <option value="3">AUTO</option>
                </select>
            </div>
            <div class="control-item">
                <button onclick="tuneChannel()">Tune</button>
            </div>
            <div id="tuneResult"></div>
        </div>

        <div class="control-section">
            <h2>Channel Presets</h2>
            <div id="channelPresetsContainer">Loading presets...</div>
            <div id="presetTuneResult"></div>
        </div>

    </div>

    <script>
        async function getTunerStatus() {
            const statusEl = document.getElementById('tunerStatus');
            // statusEl.textContent = 'Fetching status...'; 
            try {
                const response = await fetch('/api/tuner/status');
                if (!response.ok) {
                    statusEl.innerHTML = `<div class="error">Error fetching status: HTTP ${response.status}</div>`;
                    console.error(`HTTP error! status: ${response.status}`);
                    return;
                }
                const data = await response.json();
                statusEl.innerHTML = ''; // Clear previous content

                const buttonsContainer = document.createElement('div');
                buttonsContainer.style.display = 'flex';
                buttonsContainer.style.flexWrap = 'wrap';
                buttonsContainer.style.gap = '8px'; // Spacing between buttons
                buttonsContainer.style.marginBottom = '15px'; // Space below the button row

                const otherInfoContainer = document.createElement('div');
                let hasButtons = false;
                let hasOtherInfo = false;

                for (const key in data) {
                    if (data.hasOwnProperty(key)) {
                        if (key.startsWith('has_')) {
                            hasButtons = true;
                            const statusButton = document.createElement('span');
                            statusButton.className = 'status-button';
                            statusButton.classList.add(data[key] ? 'status-green' : 'status-red');
                            const statusName = key.replace('has_', '').replace(/_/g, ' ').toUpperCase();
                            statusButton.textContent = statusName;
                            buttonsContainer.appendChild(statusButton);
                        } else {
                            hasOtherInfo = true;
                            const itemDiv = document.createElement('div');
                            itemDiv.className = 'info-item'; 
                            
                            const labelSpan = document.createElement('label');
                            labelSpan.textContent = `${key.replace(/_/g, ' ').toUpperCase()}:`;
                            
                            const valueSpan = document.createElement('span');
                            valueSpan.textContent = data[key];
                            
                            itemDiv.appendChild(labelSpan);
                            itemDiv.appendChild(valueSpan);
                            otherInfoContainer.appendChild(itemDiv);
                        }
                    }
                }

                if (hasButtons) {
                    statusEl.appendChild(buttonsContainer);
                }
                if (hasOtherInfo) {
                    statusEl.appendChild(otherInfoContainer);
                }
                // If statusEl remains empty (e.g. data is empty and no error), 
                // it will just be blank, which is acceptable.

            } catch (error) {
                statusEl.innerHTML = `<div class="error">Error fetching status: ${error.message}</div>`;
                console.error('Error fetching status:', error);
            }
        }

        async function tuneChannel() {
            const resultEl = document.getElementById('tuneResult');
            resultEl.textContent = '';
            resultEl.className = '';

            const tuneParams = {
                freq_mhz: parseInt(document.getElementById('freq_mhz').value),
                sr_ksps: parseInt(document.getElementById('sr').value),
                pol: parseInt(document.getElementById('pol').value),
                fec: parseInt(document.getElementById('fec').value),
                inv: parseInt(document.getElementById('inv').value),
                delsys: parseInt(document.getElementById('delsys').value),
                mod: parseInt(document.getElementById('mod').value),
                pilot: parseInt(document.getElementById('pilot').value),
                rolloff: parseInt(document.getElementById('rolloff').value)
            };
            await executeTune(tuneParams, resultEl);
        }

        async function executeTune(tuneParams, resultElement) {
            resultElement.textContent = 'Tuning...';
            resultElement.className = '';
            try {
                const response = await fetch('/api/tuner/tune', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(tuneParams),
                });

                const data = await response.json();

                if (!response.ok) {
                    resultElement.textContent = `Error tuning: ${data.message || response.status}`;
                    resultElement.className = 'error';
                    throw new Error(`HTTP error! status: ${response.status}, message: ${data.message}`);
                }
                
                resultElement.textContent = `Tune command sent successfully: ${data.message}`;
                resultElement.className = 'success';
                setTimeout(getTunerStatus, 500); 
                setTimeout(getPolarizationState, 500); 
            } catch (error) {
                if (!resultElement.textContent || resultElement.textContent === 'Tuning...') { 
                    resultElement.textContent = `Error tuning: ${error.message}`;
                    resultElement.className = 'error';
                }
                console.error('Error tuning channel:', error);
            }
        }

        async function getTunerResetState() {
            const resetSwitch = document.getElementById('tunerResetSwitch');
            const resultEl = document.getElementById('actionResult');
            try {
                const response = await fetch('/api/tuner/reset');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                resetSwitch.checked = data.reset_active; // Assuming the API returns { "reset_active": true/false }
            } catch (error) {
                resultEl.textContent = `Error getting reset state: ${error.message}`;
                resultEl.className = 'error';
                console.error('Error getting reset state:', error);
            }
        }

        async function setTunerReset() {
            const resetSwitch = document.getElementById('tunerResetSwitch');
            const resultEl = document.getElementById('actionResult');
            const isActive = resetSwitch.checked;
            resultEl.textContent = 'Setting reset state...';
            resultEl.className = '';

            try {
                const response = await fetch('/api/tuner/reset', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ reset: isActive }), // Assuming API expects { "reset": true/false }
                });
                const data = await response.json();
                if (!response.ok) {
                    resultEl.textContent = `Error setting reset: ${data.message || response.status}`;
                    resultEl.className = 'error';
                    throw new Error(`HTTP error! status: ${response.status}, message: ${data.message}`);
                }
                resultEl.textContent = `Reset state set to ${isActive ? 'ON' : 'OFF'}: ${data.message || 'Success'}`;
                resultEl.className = 'success';
            } catch (error) {
                if (!resultEl.textContent || resultEl.textContent === 'Setting reset state...') {
                    resultEl.textContent = `Error setting reset: ${error.message}`;
                    resultEl.className = 'error';
                }
                console.error('Error setting reset state:', error);
                resetSwitch.checked = !isActive; 
            }
        }

        async function getPolarizationState() {
            const polSwitch = document.getElementById('tunerPolarization');
            const resultEl = document.getElementById('actionResult');
            try {
                const response = await fetch('/api/tuner/polarization');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                // Assuming API returns { "polarization": "H" or "V" or "OFF" }
                if (data.polarization === "H") {
                    polSwitch.checked = true;
                } else {
                    polSwitch.checked = false; // Default to V (unchecked) if not H or if OFF
                }
            } catch (error) {
                resultEl.textContent = `Error getting polarization state: ${error.message}`;
                resultEl.className = 'error';
                console.error('Error getting polarization state:', error);
            }
        }

        async function setPolarization() {
            const polSwitch = document.getElementById('tunerPolarization');
            const resultEl = document.getElementById('actionResult');
            const isChecked = polSwitch.checked;
            const polarizationValue = isChecked ? "H" : "V"; // H for checked (Horizontal), V for unchecked (Vertical)
            
            await executeSetPolarization(polarizationValue, resultEl);
        }

        async function executeSetPolarization(polarizationValue, resultElement) {
            resultElement.textContent = 'Setting polarization state...';
            resultElement.className = '';

            try {
                const response = await fetch('/api/tuner/polarization', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ polarization: polarizationValue }),
                });
                const data = await response.json();
                if (!response.ok) {
                    resultElement.textContent = `Error setting polarization: ${data.message || response.status}`;
                    resultElement.className = 'error';
                    throw new Error(`HTTP error! status: ${response.status}, message: ${data.message}`);
                }
                resultElement.textContent = `Polarization set to ${polarizationValue}: ${data.message || 'Success'}`;
                resultElement.className = 'success';
                // Update the switch state after successful API call
                const polSwitch = document.getElementById('tunerPolarization');
                if (polarizationValue === "H") {
                    polSwitch.checked = true;
                } else {
                    polSwitch.checked = false;
                }
            } catch (error) {
                if (!resultElement.textContent || resultElement.textContent === 'Setting polarization state...') {
                    resultElement.textContent = `Error setting polarization: ${error.message}`;
                    resultElement.className = 'error';
                }
                console.error('Error setting polarization state:', error);
                // Optionally revert switch on error, though getPolarizationState on load should correct it.
            }
        }

        async function initializeTuner() {
            const resultEl = document.getElementById('actionResult');
            resultEl.textContent = 'Initializing tuner...';
            resultEl.className = '';

            try {
                const response = await fetch('/api/tuner/init', {
                    method: 'POST', // Assuming POST, adjust if GET or other
                    headers: {
                        'Content-Type': 'application/json', // If sending any body, even empty
                    }
                });
                const data = await response.json(); // Assuming API returns JSON

                if (!response.ok) {
                    resultEl.textContent = `Error initializing tuner: ${data.message || response.status}`;
                    resultEl.className = 'error';
                    throw new Error(`HTTP error! status: ${response.status}, message: ${data.message}`);
                }
                if (!data.success) {
                    resultEl.textContent = `Error initializing tuner: ${data.message || response.status}`;
                    resultEl.className = 'error';
                    throw new Error(`Failed: ${response.status}, message: ${data.message}`);
                }
                
                resultEl.textContent = `Tuner initialization command sent: ${data.message || 'Success'}`;
                resultEl.className = 'success';
                // Refresh status after attempting to initialize
                setTimeout(getTunerStatus, 500); 
                setTimeout(getPolarizationState, 500); 
            } catch (error) {
                 if (!resultEl.textContent || resultEl.textContent === 'Initializing tuner...') {
                    resultEl.textContent = `Error initializing tuner: ${error.message}`;
                    resultEl.className = 'error';
                }
                console.error('Error initializing tuner:', error);
            }
        }

        async function loadChannelPresets() {
            const container = document.getElementById('channelPresetsContainer');
            const resultEl = document.getElementById('presetTuneResult');
            try {
                const response = await fetch('chan.jsn');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const presets = await response.json();
                container.innerHTML = ''; // Clear loading message

                presets.forEach(preset => {
                    const presetDiv = document.createElement('div');
                    presetDiv.className = 'control-item';

                    const labelSpan = document.createElement('span');
                    labelSpan.textContent = preset.displayName;
                    labelSpan.style.marginRight = '10px';
                    labelSpan.style.flexGrow = '1';

                    const tuneButton = document.createElement('button');
                    tuneButton.textContent = 'Tune';
                    tuneButton.onclick = async () => {
                        resultEl.textContent = ''; 
                        resultEl.className = '';
                        
                        // 2. Set tune parameters in the main form (optional, for visibility)
                        document.getElementById('freq_mhz').value = preset.freqMHz;
                        document.getElementById('sr').value = preset.tuneParams.s;
                        document.getElementById('pol').value = (preset.polarization == "H") ? 1 : 0;
                        document.getElementById('fec').value = preset.tuneParams.fec;
                        document.getElementById('inv').value = preset.tuneParams.inv;
                        document.getElementById('delsys').value = preset.tuneParams.delsys;
                        document.getElementById('mod').value = preset.tuneParams.mod;
                        document.getElementById('pilot').value = preset.tuneParams.pilot;
                        document.getElementById('rolloff').value = preset.tuneParams.rolloff;

                        // 3. Tune Channel
                        const tunePayload = {
                            freq_mhz: preset.freqMHz,
                            sr_ksps: preset.tuneParams.s,
                            pol: (preset.polarization == "H") ? 1 : 0,
                            fec: preset.tuneParams.fec,
                            inv: preset.tuneParams.inv,
                            delsys: preset.tuneParams.delsys,
                            mod: preset.tuneParams.mod,
                            pilot: preset.tuneParams.pilot,
                            rolloff: preset.tuneParams.rolloff
                        };
                        await executeTune(tunePayload, resultEl);
                    };

                    presetDiv.appendChild(labelSpan);
                    presetDiv.appendChild(tuneButton);
                    container.appendChild(presetDiv);
                });

            } catch (error) {
                container.innerHTML = `<div class="error">Error loading presets: ${error.message}</div>`;
                console.error('Error loading channel presets:', error);
            }
        }

        // Initial calls on page load
        window.onload = () => {
            getTunerStatus();
            getTunerResetState();
            getPolarizationState();
            loadChannelPresets();
            setInterval(getTunerStatus, 5000); // Refresh status every 5 seconds
        };
    </script>
</body>
</html>
